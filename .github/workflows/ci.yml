name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A green run here must mean the suite actually ran. All three PORTER_REQUIRE_*
# gates are ON: without them, a missing `uv`, a missing docker daemon or a
# missing `systemd-analyze` turns much of the suite into skips and pytest still
# exits 0 -- a green badge over a suite that tested almost nothing. That is the
# exact failure porter exists to prevent, so it is not tolerable in porter's own
# CI. PORTER_REQUIRE_SYSTEMD is the newest of the three and the easiest to lose:
# it guards the only check that every directive in the emitted unit is one
# systemd recognises, and a slimmer runner image is exactly where the binary
# would quietly not be there.
# PORTER_REQUIRE_CC is the fourth, added with Task 13. `native_binaries:` is
# proved against a REAL compiled object -- the whole point is that the ELF
# header is read rather than described -- so a runner without a C compiler
# would skip every test that covers rule 11's derivation, and a skipped test is
# green.
# PORTER_REQUIRE_NSPAWN is the fifth, added with Task 14, and it is armed on a
# MEASUREMENT rather than a hope. It was deliberately left out while nobody knew
# whether a GitHub-hosted runner could boot systemd-nspawn -- arming a gate that
# cannot be satisfied turns every run red for a reason unrelated to the change
# under test, which is its own kind of uninformative. Measured 2026-08-08 on
# `ubuntu-latest`, in 33 seconds end to end: with `systemd-container` installed
# it exports a Debian root through docker, boots it `--private-network --boot`,
# comes up with systemd as PID 1, reports `systemd-detect-virt --container` =
# systemd-nspawn, isolates to `lo` alone, and applies ProtectSystem=strict to a
# transient unit. So the hole AGENTS.md's rule pointed at is closed rather than
# excused: the only tests in porter that start a unit with systemd cannot
# silently skip here.
env:
  PORTER_REQUIRE_UV: "1"
  PORTER_REQUIRE_DOCKER: "1"
  PORTER_REQUIRE_SYSTEMD: "1"
  PORTER_REQUIRE_CC: "1"
  PORTER_REQUIRE_NSPAWN: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    # Raised for the nspawn gate: three systemd boots and a 97 MB package in the
    # suite, and the same again inside `reverify-guards.sh` for each of the eight
    # entries whose scope is tests/test_nspawn_gate.py.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The suite vendors a python-build-standalone tree (~97 MB unpacked) and
      # builds .deb packages, so it needs real disk and a working dpkg-deb.
      # ubuntu-latest has dpkg-deb; assert it rather than discovering it midway.
      - name: Preconditions
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null || { echo "dpkg-deb missing"; exit 1; }
          # PORTER_REQUIRE_SYSTEMD=1 makes its absence a test failure anyway;
          # naming it here turns that into one legible line instead of a
          # failure discovered midway through the suite.
          command -v systemd-analyze >/dev/null || { echo "systemd-analyze missing"; exit 1; }
          # systemd-nspawn is NOT on a runner by default -- it lives in
          # systemd-container. With PORTER_REQUIRE_NSPAWN=1 its absence is a
          # test failure, so install it here and assert it landed, which turns
          # "the gate can't nspawn" into one legible line instead of a wall of
          # failures halfway through the suite.
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd-container
          command -v systemd-nspawn >/dev/null || { echo "systemd-nspawn missing"; exit 1; }
          sudo -n true || { echo "passwordless sudo missing; nspawn gate cannot run"; exit 1; }
          # Same bargain for the compiler examples/native-binary bakes with.
          command -v cc >/dev/null || { echo "cc missing"; exit 1; }
          docker version --format '{{.Server.Version}}'
          df -h / | tail -1

      - name: Test suite
        run: uv run --extra dev pytest -v --durations=10

      # The gate that matters: every guard is disabled at its use site in turn
      # and the suite must go red. A guard whose test cannot fail licenses
      # shipping. This is slower than the suite it wraps -- that is the point.
      - name: Guards still bite
        # In-place is correct here and only here: the runner's checkout is
        # nobody else's, and actions/checkout's shallow clone makes worktrees a
        # needless complication. Locally the script isolates itself, because
        # porter's checkout is shared with peer agents.
        env:
          PORTER_GUARDS_INPLACE: "1"
        run: bash scripts/reverify-guards.sh

      # Advisory, not a gate: three pre-existing findings predate this workflow
      # and nobody has decided them. Deliberately not silenced either -- the
      # output lands in the log so the decision stays visible.
      - name: Lint (advisory)
        run: uv run --extra dev ruff check . || true

  # Proves the claim the whole design rests on: one build on the glibc floor runs
  # on every supported target. Cheap to run, and the failure it catches (a
  # too-new build host) is invisible on the machine that produced it.
  glibc-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Vendor an interpreter on the floor and run it on newer targets
        run: |
          set -euo pipefail
          uv run --extra dev python -c "
          from pathlib import Path
          from porter.interpreter import vendor, install
          b = vendor(Path('/tmp/floor'))
          install(b, ['idna'])
          print('vendored:', b)
          "
          for img in ubuntu:22.04 debian:12 ubuntu:24.04 debian:13; do
            echo \"-- $img --\"
            docker run --rm --network none -v /tmp/floor:/floor:ro "$img" \
              /floor/python/bin/python3.12 -c \
              "import idna, sys; print(sys.version.split()[0], 'idna ok')"
          done
