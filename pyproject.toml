[project]
name = "porter"
version = "0.1.0"
description = "Airgapped .deb installers for Debian-family clients"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

# Deliberately thin. porter shells out to dpkg-deb, tar and systemd-nspawn --
# all of which ship with the build host -- rather than reimplementing them.
# The Packages index is emitted from `dpkg-deb --field`, so dpkg-dev is NOT
# required: it is absent on demos, which is the build host.
dependencies = [
    "microcli-toolkit>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
porter = "porter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
